# Production-Grade Modern Git Configuration Template
# Place or include in ~/.gitconfig or project .git/config

[init]
    defaultBranch = main

[core]
    # Use modern histogram diff algorithm and sensible line ending discipline
    autocrlf = input
    editor = vim
    quotepath = false
    # Accelerate repository status in large codebases
    untrackedCache = true

[pull]
    # Always rebase when pulling to prevent messy non-linear merge bubbles
    rebase = true

[push]
    # Automatically setup remote tracking on first push of a new branch
    autoSetupRemote = true
    default = simple
    followTags = true

[rebase]
    # Automatically stash uncommitted changes before rebase and unstash after
    autoStash = true
    # Automatically apply fixup/squash commits when running interactive rebase
    autoSquash = true

[fetch]
    # Clean up stale remote branches automatically upon every fetch
    prune = true
    pruneTags = true

[merge]
    # zdiff3 shows common ancestor block alongside current and incoming changes
    conflictstyle = zdiff3

[rerere]
    # Reuse Recorded Resolution: remembers how you resolved conflicts
    enabled = true
    autoUpdate = true

[diff]
    # Superior diff algorithm yielding cleaner, more semantic patches
    algorithm = histogram
    colorMoved = default
    renames = copies

[tag]
    # Natural semantic version sorting (v1.2.9 < v1.2.10)
    sort = version:refname

[branch]
    # Sort branches by most recently committed
    sort = -committerdate

[column]
    ui = auto

[color]
    ui = auto

[alias]
    # Porcelain shortcuts
    st = status -sb
    sw = switch
    restore-staged = restore --staged
    
    # Modern high-signal log
    lg = log --graph --pretty=format:'%C(yellow)%h%Creset -%C(auto)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --abbrev-commit
    lga = log --graph --pretty=format:'%C(yellow)%h%Creset -%C(auto)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --abbrev-commit --all
    
    # Safe force push alias
    push-safe = push --force-with-lease --force-if-includes
    
    # Fixup commit helpers
    fixup = "!f() { git commit --fixup \"$1\"; }; f"
    autosquash = "!f() { git rebase -i --autosquash \"$1\"; }; f"
    
    # Clean up local branches merged into target/trunk branch
    cleanup = "!f() { target=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@'); [ -z \"$target\" ] && target=main; git branch --format='%(refname:short)' --merged \"$target\" | grep -vE \"^($target|master|trunk|develop|staging)$\" | xargs -r git branch -d; }; f"
